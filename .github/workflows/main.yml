name: GitHub Self-Updating Repository

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - name: Install dependencies
        run: npm install
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Create GLORY.ics
        run: |
          npm start
      - name: Verify GLORY.ics exists
        run: |
          if [ ! -f GLORY.ics ]; then
            echo "Error: GLORY.ics was not generated."
            ls -la
            exit 1
          fi
      - name: Upload GLORY.ics artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: GLORY.ics
          path: GLORY.ics
      - name: Switch to publish branch
        if: github.event_name != 'pull_request'
        run: |
          cp GLORY.ics /tmp/GLORY.ics
          git fetch origin ics:ics || true
          if git show-ref --verify --quiet refs/heads/ics; then
            git checkout ics
          else
            git checkout --orphan ics
            git rm -rf .
          fi
      - name: Copy generated calendar into publish branch
        if: github.event_name != 'pull_request'
        run: |
          cp /tmp/GLORY.ics ./GLORY.ics
      - name: Push to repository
        if: github.event_name != 'pull_request'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add GLORY.ics
          git diff --cached --quiet || git commit -m "Update GLORY.ics"
          git push -u origin ics
